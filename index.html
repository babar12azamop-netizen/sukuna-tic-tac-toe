<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #05080f; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
            padding-bottom: 110px; overflow-x: hidden;
        }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05080f; z-index: 100000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 60px; height: 60px; border: 4px solid #121e36; border-top: 4px solid #00f2fe;
            border-radius: 50%; animation: spin 0.8s linear infinite; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.3rem; color: #00f2fe; text-shadow: 0 0 12px rgba(0, 242, 254, 0.6); font-weight: bold; letter-spacing: 3px; }

        #charSelection {
            text-align: center; max-width: 400px; width: 90%; padding: 25px; background: #0b111e; border-radius: 20px; border: 2px solid #1a2a4a;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15); display: none;
        }
        .char-title { color: #00f2fe; font-size: 1.5rem; margin-bottom: 25px; text-shadow: 0 0 15px rgba(0, 242, 254, 0.5); letter-spacing: 1px; }
        .char-container { display: flex; justify-content: space-around; gap: 15px; margin-bottom: 25px; }
        .char-card { background: #0f182b; border: 2px solid #1a2a4a; border-radius: 15px; padding: 20px 10px; width: 46%; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .char-card:hover { border-color: #00f2fe; transform: scale(1.05); }
        .char-card.gojo-card.selected { border-color: #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); background: #10223d; }
        .char-card.sukuna-card.selected { border-color: #ff4b5c; box-shadow: 0 0 25px rgba(255, 75, 92, 0.5); background: #261118; }
        .char-avatar { font-size: 3.5rem; margin-bottom: 12px; display: block; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .char-name { font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px; }
        .gojo-name { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
        .sukuna-name { color: #ff4b5c; text-shadow: 0 0 10px rgba(255, 75, 92, 0.4); }
        .start-game-btn { background: #00f2fe; width: 100%; padding: 14px; border: none; border-radius: 10px; color: #05080f; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; letter-spacing: 1px; }
        .start-game-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); transform: translateY(-2px); }

        .game-container { 
            text-align: center; max-width: 400px; width: 90%; padding: 25px; background: #0b111e; border-radius: 20px; border: 2px solid #1a2a4a;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15); display: none;
        }
        h1 { color: #00f2fe; margin-bottom: 18px; font-size: 1.8rem; text-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
        .status { margin-bottom: 20px; font-size: 1.1rem; background: #111a2e; padding: 12px; border-radius: 12px; border: 1px solid #1a2a4a; }
        .status-turn { color: #00f2fe; font-weight: bold; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 12px; justify-content: center; margin-bottom: 25px; }
        .cell { 
            aspect-ratio: 1; background: #0f182b; border: 2px solid #1a2a4a; border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; font-size: 3rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; 
        }
        .cell:hover { background: #15223d; border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .cell.gojo-glow { color: #00f2fe; text-shadow: 0 0 20px #00f2fe; box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
        .cell.sukuna-glow { color: #ff4b5c; text-shadow: 0 0 20px #ff4b5c; box-shadow: inset 0 0 15px rgba(255, 75, 92, 0.2); border-color: #ff4b5c; }
        .mode-selection { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .mode-selection button { padding: 12px 16px; background: #111a2e; border: 1px solid #1a2a4a; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .mode-selection button.active { background: #00f2fe; border-color: #00f2fe; color: #05080f; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .reset-btn { background: #ff4b5c; width: 100%; max-width: 220px; margin: 0 auto; display: block; border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255, 75, 92, 0.2); transition: 0.3s; }
        .reset-btn:hover { background: #ff6b7b; box-shadow: 0 0 15px rgba(255, 75, 92, 0.4); transform: translateY(-1px); }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">SUKUNA DOMAIN EXPANSION...</div>
</div>

<div id="charSelection">
    <h2 class="char-title">CHOOSE YOUR JUJUTSU SORCERER</h2>
    <div class="char-container">
        <div class="char-card gojo-card selected" onclick="selectCharacter('Gojo')">
            <span class="char-avatar">👁️‍⚡</span>
            <span class="char-name gojo-name">SATORU GOJO</span>
        </div>
        <div class="char-card sukuna-card" onclick="selectCharacter('Sukuna')">
            <span class="char-avatar">💀🔥</span>
            <span class="char-name sukuna-name">RYOMEN SUKUNA</span>
        </div>
    </div>
    <button class="start-game-btn" onclick="startGame()">ENTER THE DOMAIN</button>
</div>

<div class="game-container" id="gameContainer">
    <h1>Sukuna Tic-Tac-Toe</h1>
    <div class="mode-selection">
        <button id="pvpBtn" class="active">Player vs Player</button>
        <button id="pveBtn">Vs Shatar Bot 👿</button>
    </div>
    <div class="status" id="statusText">Initialised...</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button class="reset-btn" id="resetBtn">Restart Game</button>
</div>

<script>
    let audioCtx = null;
    function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
    
    // Customized Anime Sound Synthesizer
    function playAnimeSound(type) {
        try {
            initAudio(); if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            if (type === 'gojo') {
                // Gojo: High tech hollow purple sound beam
                const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(587.33, now); // D5
                osc1.frequency.exponentialRampToValueAtTime(1174.66, now + 0.2); // D6
                osc2.type = 'triangle'; osc2.frequency.setValueAtTime(293.66, now);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
                osc1.start(); osc2.start(); osc1.stop(now + 0.25); osc2.stop(now + 0.25);
            } else if (type === 'sukuna') {
                // Sukuna: Dismantle / Heavy cutting slicing tone
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(now + 0.22);
            } else if (type === 'win') {
                // Win chime
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(now + 0.4);
            }
        } catch(e){}
    }

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            const charScreen = document.getElementById('charSelection');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; charScreen.style.display = 'block'; }, 500);
        }, 2200);
    });

    let userCharacter = "Gojo"; 
    let p1Sign = "👁️‍⚡"; // Gojo Real Avatar Face
    let p2Sign = "💀🔥"; // Sukuna Real Avatar Face

    function selectCharacter(char) {
        userCharacter = char;
        if(char === 'Gojo') {
            playAnimeSound('gojo');
            document.querySelector('.gojo-card').classList.add('selected');
            document.querySelector('.sukuna-card').classList.remove('selected');
            p1Sign = "👁️‍⚡"; p2Sign = "💀🔥";
        } else {
            playAnimeSound('sukuna');
            document.querySelector('.sukuna-card').classList.add('selected');
            document.querySelector('.gojo-card').classList.remove('selected');
            p1Sign = "💀🔥"; p2Sign = "👁️‍⚡";
        }
    }

    function startGame() {
        playAnimeSound('win');
        document.getElementById('charSelection').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        updateTurnDisplay();
    }

    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const resetBtn = document.getElementById('resetBtn');
    const pvpBtn = document.getElementById('pvpBtn');
    const pveBtn = document.getElementById('pveBtn');

    let board = ["", "", "", "", "", "", "", "", ""]; 
    let currentPlayer = "P1"; 
    let isGameActive = true; 
    let isVsBot = false; 
    let isBotThinking = false; 

    const winningConditions = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

    function updateTurnDisplay() {
        let currentSign = (currentPlayer === "P1") ? p1Sign : p2Sign;
        let label = "";
        if (isVsBot && currentPlayer === "P2") {
            label = "Sukuna Bot 🤖";
        } else {
            if (currentPlayer === "P1") {
                label = (userCharacter === "Gojo") ? "Gojo (You)" : "Sukuna (You)";
            } else {
                label = (userCharacter === "Gojo") ? "Sukuna" : "Gojo";
            }
        }
        statusText.innerHTML = `Player <span class="status-turn">${label} [${currentSign}]</span> ki baari hai`;
    }

    function handleCellClick(e) {
        initAudio(); 
        const clickedCell = e.target;
        const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
        if (board[clickedCellIndex] !== "" || !isGameActive || isBotThinking) return;

        let activeSign = (currentPlayer === "P1") ? p1Sign : p2Sign;
        if(activeSign === "👁️‍⚡") playAnimeSound('gojo'); else playAnimeSound('sukuna');

        makeMove(clickedCell, clickedCellIndex, currentPlayer);
        if (checkResult()) return;

        if (isVsBot) {
            currentPlayer = "P2"; updateTurnDisplay();
            isBotThinking = true; setTimeout(botMove, 500);
        } else {
            currentPlayer = (currentPlayer === "P1") ? "P2" : "P1";
            updateTurnDisplay();
        }
    }

    function makeMove(cell, index, player) {
        board[index] = player; 
        let currentSign = (player === "P1") ? p1Sign : p2Sign; 
        cell.innerText = currentSign;
        if(currentSign === "👁️‍⚡") cell.className = "cell gojo-glow"; else cell.className = "cell sukuna-glow";
    }

    function botMove() {
        if (!isGameActive) { isBotThinking = false; return; }
        let bestScore = -Infinity; let move = null;
        for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
                board[i] = "P2"; let score = minimax(board, 0, false); board[i] = "";
                if (score > bestScore) { bestScore = score; move = i; }
            }
        }
        if (move !== null) {
            const targetCell = document.querySelector(`[data-index='${move}']`);
            if(p2Sign === "👁️‍⚡") playAnimeSound('gojo'); else playAnimeSound('sukuna');
            makeMove(targetCell, move, "P2");
            if (!checkResult()) { currentPlayer = "P1"; updateTurnDisplay(); }
        }
        isBotThinking = false; 
    }

    function minimax(currBoard, depth, isMaximizing) {
        let result = evaluateBoard(); if (result !== null) return result;
        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) { if (currBoard[i] === "") { currBoard[i] = "P2"; let score = minimax(currBoard, depth + 1, false); currBoard[i] = ""; bestScore = Math.max(score, bestScore); } }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < 9; i++) { if (currBoard[i] === "") { currBoard[i] = "P1"; let score = minimax(currBoard, depth + 1, true); currBoard[i] = ""; bestScore = Math.min(score, bestScore); } }
            return bestScore;
        }
    }

    function evaluateBoard() {
        for (let i = 0; i < winningConditions.length; i++) { const [a, b, c] = winningConditions[i]; if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a] === "P2" ? 10 : -10; }
        if (!board.includes("")) return 0; return null;
    }

    function checkResult() {
        let roundWon = false;
        for (let i = 0; i < winningConditions.length; i++) { const [a, b, c] = winningConditions[i]; if (board[a] && board[a] === board[b] && board[a] === board[c]) { roundWon = true; break; } }
        if (roundWon) {
            playAnimeSound('win'); 
            let winnerLabel = "";
            if (isVsBot && currentPlayer === "P2") { winnerLabel = "Sukuna Bot 🤖"; } 
            else { winnerLabel = (currentPlayer === "P1") ? (userCharacter === "Gojo" ? "Gojo (You)" : "Sukuna (You)") : (userCharacter === "Gojo" ? "Sukuna" : "Gojo"); }
            statusText.innerHTML = `<span class="status-turn">${winnerLabel} Jeet Gaya! 🎉</span>`; isGameActive = false; return true;
        }
        if (!board.includes("")) { statusText.innerHTML = "<span class='status-turn'>Match Draw! 🤝</span>"; isGameActive = false; return true; }
        return false;
    }

    function restartGame() { board = ["", "", "", "", "", "", "", "", ""]; isGameActive = true; isBotThinking = false; currentPlayer = "P1"; updateTurnDisplay(); cells.forEach(cell => { cell.innerText = ""; cell.className = "cell"; }); }
    pvpBtn.addEventListener('click', () => { if(isBotThinking) return; isVsBot = false; pvpBtn.classList.add('active'); pveBtn.classList.remove('active'); restartGame(); });
    pveBtn.addEventListener('click', () => { if(isBotThinking) return; isVsBot = true; pveBtn.classList.add('active'); pvpBtn.classList.remove('active'); restartGame(); });
    cells.forEach(cell => cell.addEventListener('click', handleCellClick)); resetBtn.addEventListener('click', restartGame);
</script>
