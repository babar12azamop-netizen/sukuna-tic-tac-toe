<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sukuna Tic-Tac-Toe - JJK Domain</title>
    
    <script type='text/javascript' src='//pl29645921.effectivecpmnetwork.com/7c/2e/ca/7c2eca2805cf777029a3250e6bb59bf6.js'></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #040711; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
            padding-bottom: 110px; overflow: hidden;
        }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #040711; z-index: 100000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #111e36; border-top: 4px solid #00f2fe;
            border-radius: 50%; animation: spin 0.8s linear infinite; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.1rem; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); font-weight: bold; letter-spacing: 2px; }

        #charSelection {
            text-align: center; max-width: 380px; width: 92%; padding: 25px; background: #0a0f1d; border-radius: 20px; border: 2px solid #162645;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1); display: none;
        }
        .char-title { color: #00f2fe; font-size: 1.3rem; margin-bottom: 25px; text-shadow: 0 0 12px rgba(0, 242, 254, 0.4); letter-spacing: 1px; }
        .char-container { display: flex; justify-content: space-around; gap: 12px; margin-bottom: 25px; }
        .char-card { background: #0e1629; border: 2px solid #162645; border-radius: 15px; padding: 18px 8px; width: 47%; cursor: pointer; transition: all 0.25s ease; }
        .char-card:hover { border-color: #00f2fe; transform: translateY(-2px); }
        .char-card.gojo-card.selected { border-color: #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); background: #0f203b; }
        .char-card.sukuna-card.selected { border-color: #ff4b5c; box-shadow: 0 0 20px rgba(255, 75, 92, 0.4); background: #241016; }
        .char-display-face { font-size: 2.2rem; margin-bottom: 8px; display: block; }
        .char-name { font-weight: bold; font-size: 1rem; letter-spacing: 0.5px; }
        .gojo-name { color: #00f2fe; }
        .sukuna-name { color: #ff4b5c; }
        .start-game-btn { background: #00f2fe; width: 100%; padding: 12px; border: none; border-radius: 8px; color: #040711; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 5px; transition: 0.2s; }

        .game-container { 
            text-align: center; max-width: 380px; width: 92%; padding: 25px; background: #0a0f1d; border-radius: 20px; border: 2px solid #162645;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1); display: none;
        }
        h1 { color: #00f2fe; margin-bottom: 15px; font-size: 1.6rem; text-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .status { margin-bottom: 18px; font-size: 1rem; background: #0f172b; padding: 10px; border-radius: 10px; border: 1px solid #162645; min-height: 42px; display: flex; justify-content: center; align-items: center; }
        .status-turn { color: #00f2fe; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 12px; justify-content: center; margin-bottom: 20px; }
        .cell { 
            aspect-ratio: 1; background: #0e1629; border: 2px solid #162645; border-radius: 15px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; transition: all 0.2s ease; 
        }
        .cell-name { font-size: 0.8rem; font-weight: bold; margin-top: 2px; letter-spacing: 0.5px; }
        .cell-icon { font-size: 1.6rem; }
        
        .cell.gojo-glow { color: #00f2fe; text-shadow: 0 0 15px #00f2fe; box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
        .cell.sukuna-glow { color: #ff4b5c; text-shadow: 0 0 15px #ff4b5c; box-shadow: inset 0 0 12px rgba(255, 75, 92, 0.2); border-color: #ff4b5c; }
        
        .mode-selection { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
        .mode-selection button { padding: 10px 14px; background: #0f172b; border: 1px solid #162645; border-radius: 8px; color: #fff; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; }
        .mode-selection button.active { background: #00f2fe; border-color: #00f2fe; color: #040711; box-shadow: 0 0 12px rgba(0, 242, 254, 0.3); }
        .reset-btn { background: #ff4b5c; width: 100%; max-width: 200px; margin: 0 auto; display: block; border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .reset-btn:hover { background: #ff6b7b; }
    </style>
</head>
<body onclick="handleUserInteraction(event)">

<div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">INITIALISING DOMAINS...</div>
</div>

<div id="charSelection">
    <h2 class="char-title">SELECT YOUR SORCERER</h2>
    <div class="char-container">
        <div class="char-card gojo-card selected" onclick="selectCharacter('Gojo', event)">
            <span class="char-display-face">⚡</span>
            <span class="char-name gojo-name">GOJO</span>
        </div>
        <div class="char-card sukuna-card" onclick="selectCharacter('Sukuna', event)">
            <span class="char-display-face">💀</span>
            <span class="char-name sukuna-name">SUKUNA</span>
        </div>
    </div>
    <button class="start-game-btn" onclick="startGame(event)">INITIALISE MATCH</button>
</div>

<div class="game-container" id="gameContainer">
    <h1>Sukuna Tic-Tac-Toe</h1>
    <div class="mode-selection">
        <button id="pvpBtn" class="active">2 Players</button>
        <button id="pveBtn">Vs Shatar Bot 👿</button>
    </div>
    <div class="status" id="statusText">Loading Board...</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button class="reset-btn" id="resetBtn">Restart Match</button>
</div>

<script>
    // Stable high-quality MP3 links hosted on ultra fast cloud stream
    const gojoAudio = new Audio("https://files.catbox.moe/kpk2g8.mp3");
    const sukunaAudio = new Audio("https://files.catbox.moe/9vpt84.mp3");
    const expansionAudio = new Audio("https://files.catbox.moe/f0p4by.mp3");

    // Force preloading streams
    gojoAudio.load(); sukunaAudio.load(); expansionAudio.load();

    let isAudioUnlocked = false;

    // This unique bypass handler unlocks BOTH audio engines and popups on the very first user touch
    function handleUserInteraction(e) {
        if (!isAudioUnlocked) {
            // Play & immediately pause to register browser media tokens safely
            gojoAudio.play().then(() => { gojoAudio.pause(); gojoAudio.currentTime = 0; }).catch(err => {});
            sukunaAudio.play().then(() => { sukunaAudio.pause(); sukunaAudio.currentTime = 0; }).catch(err => {});
            expansionAudio.play().then(() => { expansionAudio.pause(); expansionAudio.currentTime = 0; }).catch(err => {});
            isAudioUnlocked = true;
        }

        // Popunder direct force routing via system click proxy delegation
        if (typeof window.dispatchEvent === 'function') {
            try {
                let proxyEvent = new MouseEvent('click', { bubbles: true, cancelable: true, view: window });
                document.body.dispatchEvent(proxyEvent);
            } catch(e){}
        }
    }

    function playSorcererVoice(role) {
        if(!isAudioUnlocked) return;
        try {
            if (role === 'gojo') {
                gojoAudio.currentTime = 0; gojoAudio.volume = 1.0; gojoAudio.play();
            } else if (role === 'sukuna') {
                sukunaAudio.currentTime = 0; sukunaAudio.volume = 1.0; sukunaAudio.play();
            } else if (role === 'expansion') {
                expansionAudio.currentTime = 0; expansionAudio.volume = 0.95; expansionAudio.play();
            }
        } catch(err){}
    }

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; document.getElementById('charSelection').style.display = 'block'; }, 400);
        }, 1500);
    });

    let userCharacter = "Gojo"; 
    let p1Data = { name: "GOJO", icon: "⚡", style: "gojo-glow" };
    let p2Data = { name: "SUKUNA", icon: "💀", style: "sukuna-glow" };

    function selectCharacter(char, e) {
        if(e) e.stopPropagation();
        handleUserInteraction();
        userCharacter = char;
        if(char === 'Gojo') {
            playSorcererVoice('gojo');
            document.querySelector('.gojo-card').classList.add('selected');
            document.querySelector('.sukuna-card').classList.remove('selected');
            p1Data = { name: "GOJO", icon: "⚡", style: "gojo-glow" };
            p2Data = { name: "SUKUNA", icon: "💀", style: "sukuna-glow" };
        } else {
            playSorcererVoice('sukuna');
            document.querySelector('.sukuna-card').classList.add('selected');
            document.querySelector('.gojo-card').classList.remove('selected');
            p1Data = { name: "SUKUNA", icon: "💀", style: "sukuna-glow" };
            p2Data = { name: "GOJO", icon: "⚡", style: "gojo-glow" };
        }
    }

    function startGame(e) {
        if(e) e.stopPropagation();
        handleUserInteraction();
        playSorcererVoice('expansion');
        document.getElementById('charSelection').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        updateTurnDisplay();
    }

    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const resetBtn = document.getElementById('resetBtn');
    const pvpBtn = document.getElementById('pvpBtn');
    const pveBtn = document.getElementById('pveBtn');

    let board = ["", "", "", "", "", "", "", "", ""]; 
    let currentPlayer = "P1"; 
    let isGameActive = true; 
    let isVsBot = false; 
    let isBotThinking = false; 

    const winningConditions = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

    function updateTurnDisplay() {
        let activeData = (currentPlayer === "P1") ? p1Data : p2Data;
        let showName = activeData.name;
        if (isVsBot && currentPlayer === "P2") showName = "BOT " + showName;
        statusText.innerHTML = `Turn: <span class="status-turn" style="color:${currentPlayer==='P1'?'#00f2fe':'#ff4b5c'}">${showName} [${activeData.icon}]</span>`;
    }

    function handleCellClick(e) {
        if(e) e.stopPropagation();
        handleUserInteraction();
        if (!isGameActive || isBotThinking) return;
        
        const cell = e.currentTarget;
        const index = parseInt(cell.getAttribute('data-index'));
        if (board[index] !== "") return;

        let activeData = (currentPlayer === "P1") ? p1Data : p2Data;
        if(activeData.name === "GOJO") playSorcererVoice('gojo'); else playSorcererVoice('sukuna');

        makeMove(cell, index, currentPlayer);
        if (checkResult()) return;

        if (isVsBot) {
            currentPlayer = "P2"; updateTurnDisplay();
            isBotThinking = true; setTimeout(botMove, 450);
        } else {
            currentPlayer = (currentPlayer === "P1") ? "P2" : "P1";
            updateTurnDisplay();
        }
    }

    function makeMove(cell, index, player) {
        board[index] = player; 
        let activeData = (player === "P1") ? p1Data : p2Data;
        cell.innerHTML = `<span class="cell-icon">${activeData.icon}</span><span class="cell-name">${activeData.name}</span>`;
        cell.className = `cell ${activeData.style}`;
    }

    function botMove() {
        if (!isGameActive) { isBotThinking = false; return; }
        
        let move = null;
        if (Math.random() < 0.4) {
            let emptyCells = [];
            for(let i=0; i<9; i++) { if(board[i] === "") emptyCells.push(i); }
            if(emptyCells.length > 0) move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        } 
        
        if (move === null) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "P2"; let score = minimax(board, 0, false); board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
        }

        if (move !== null && move !== undefined) {
            const targetCell = document.querySelector(`[data-index='${move}']`);
            if(p2Data.name === "GOJO") playSorcererVoice('gojo'); else playSorcererVoice('sukuna');
            makeMove(targetCell, move, "P2");
            if (!checkResult()) { currentPlayer = "P1"; updateTurnDisplay(); }
        }
        isBotThinking = false; 
    }

    function minimax(currBoard, depth, isMaximizing) {
        let result = evaluateBoard(); if (result !== null) return result;
        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) { if (currBoard[i] === "") { currBoard[i] = "P2"; let score = minimax(currBoard, depth + 1, false); currBoard[i] = ""; bestScore = Math.max(score, bestScore); } }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < 9; i++) { if (currBoard[i] === "") { currBoard[i] = "P1"; let score = minimax(currBoard, depth + 1, true); currBoard[i] = ""; bestScore = Math.min(score, bestScore); } }
            return bestScore;
        }
    }

    function evaluateBoard() {
        for (let i = 0; i < winningConditions.length; i++) { const [a, b, c] = winningConditions[i]; if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a] === "P2" ? 10 : -10; }
        if (!board.includes("")) return 0; return null;
    }

    function checkResult() {
        let roundWon = false;
        for (let i = 0; i < winningConditions.length; i++) { const [a, b, c] = winningConditions[i]; if (board[a] && board[a] === board[b] && board[a] === board[c]) { roundWon = true; break; } }
        
        if (roundWon) {
            playSorcererVoice('expansion'); 
            isGameActive = false;
            let activeData = (currentPlayer === "P1") ? p1Data : p2Data;
            let finalName = activeData.name;
            if(isVsBot && currentPlayer === "P2") finalName = "BOT " + finalName;
            statusText.innerHTML = `<span style="color:#00f2fe; font-weight:bold;">🎉 ${finalName} Won the Domain!</span>`; 
            return true;
        }
        if (!board.includes("")) { 
            statusText.innerHTML = "<span style='color:#fff; font-weight:bold;'>Match Draw! 🤝</span>"; 
            isGameActive = false; 
            return true; 
        }
        return false;
    }

    function restartGame(e) { 
        if(e) e.stopPropagation();
        handleUserInteraction();
        board = ["", "", "", "", "", "", "", "", ""]; 
        isGameActive = true; isBotThinking = false; currentPlayer = "P1"; 
        updateTurnDisplay(); 
        cells.forEach(cell => { cell.innerHTML = ""; cell.className = "cell"; }); 
    }
    
    pvpBtn.addEventListener('click', (e) => { e.stopPropagation(); if(isBotThinking) return; isVsBot = false; pvpBtn.classList.add('active'); pveBtn.classList.remove('active'); restartGame(); });
    pveBtn.addEventListener('click', (e) => { e.stopPropagation(); if(isBotThinking) return; isVsBot = true; pveBtn.classList.add('active'); pvpBtn.classList.remove('active'); restartGame(); });
    cells.forEach(cell => cell.addEventListener('click', handleCellClick)); resetBtn.addEventListener('click', restartGame);
</script>

</div>
